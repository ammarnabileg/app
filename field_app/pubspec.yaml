name: onz_field
description: "بوابة الموظف — البصمة والحضور والطلبات، ورحلة المندوب لمن كان مندوبًا."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # الشبكة: طلبات بسيطة مع كعكة الجلسة. لا مكتبة ثقيلة لواجهةٍ من
  # ثمانية مسارات.
  http: ^1.2.2

  # الموقع. اختير geolocator وحده لأنه يغطّي المنصّتين بلا إضافةٍ
  # ثانية: خدمةٌ أمامية على أندرويد (foregroundNotificationConfig)،
  # وتحديثاتٌ في الخلفية على iOS (allowBackgroundLocationUpdates).
  geolocator: ^14.0.3

  # الكاميرا. التقاطٌ داخل التطبيق لا اختيارٌ من المعرض — وهذا شرط
  # النظام لا تفضيل واجهة.
  camera: ^0.12.1

  # بيانات الدخول: مخزن النظام (Keystore/Keychain) لا ملفٌّ عادي.
  flutter_secure_storage: ^11.2.0

  # طابور ما لم يُرسَل بعد. والمسار من sqflite نفسها
  # (`getDatabasesPath`)، فلا حاجة إلى path_provider.
  sqflite: ^2.3.3+1

  # الأذونات تُطلب من geolocator وcamera مباشرةً.
  # و`permission_handler` كان مُعلَنًا بلا أن يُستورَد في سطر —
  # وهو يدمج أذوناتٍ في بيان أندرويد، فحذفُه ليس تنظيفًا فحسب.
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
