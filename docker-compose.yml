# نشر متعدّد العملاء على مضيف واحد.
#
# كل عميل = ملف .env خاص به + `docker compose -p <اسم> up -d`.
# لا يُعدَّل هذا الملف لكل عميل؛ تُغيَّر المتغيّرات وحدها.
#
# ما يجب أن يكون فريدًا لكل عميل:
#   COMPANY      اسم المشروع، ومنه تُشتقّ أسماء الحاويات والتخزين
#   WEB_PORT     منفذ الويب على المضيف
#   ADMS_PORT    منفذ خادم البصمة على المضيف
#
# المنافذ الداخلية تبقى ثابتة (5000 و8081): الشبكة معزولة لكل مشروع،
# فلا تتصادم. المتصادم هو منفذ المضيف وحده.

services:
  hr_web:
    build: .
    # الصورة موسومة باسم العميل: الخدمات الثلاث من Dockerfile واحد فتُبنى
    # مرة واحدة، والوسم الخاص يمنع أن تغيّر إعادةُ بناء عميلٍ نسخةَ عميل
    # آخر — وهو ما يحدث لو تشاركت الـstacks وسمًا واحدًا.
    image: hr_system_${COMPANY}:latest
    pull_policy: build
    container_name: ${COMPANY:?اضبط COMPANY في متغيّرات البيئة}_web
    restart: unless-stopped
    ports:
      # عند التشغيل خلف وسيط (Plesk / nginx) يُضبط BIND=127.0.0.1 فلا
      # يُنشر المنفذ على الشبكة إطلاقًا: الوسيط يصل عبر شبكة Docker
      # الداخلية على المنفذ 5000. وبدون ذلك يبقى مسار ثانٍ إلى النظام
      # بلا تشفير يتخطّى الوسيط وشهادته.
      - "${BIND:-0.0.0.0}:${WEB_PORT:-5000}:5000"
    volumes:
      - hr_data:/app/data
    environment:
      - FLASK_ENV=production
      - HR_DATA_DIR=/app/data
      - APP_PORT=5000
      - TZ=${TZ:-Asia/Kuwait}
      - COMPANY_NAME=${COMPANY}
    command: python app.py
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/login"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  hr_sync:
    image: hr_system_${COMPANY}:latest
    pull_policy: build
    container_name: ${COMPANY}_sync
    restart: unless-stopped
    volumes:
      - hr_data:/app/data
    environment:
      - HR_DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Kuwait}
      - COMPANY_NAME=${COMPANY}
    command: python fingerprint_sync.py
    depends_on:
      hr_web:
        condition: service_healthy

  hr_adms:
    image: hr_system_${COMPANY}:latest
    pull_policy: build
    container_name: ${COMPANY}_adms
    restart: unless-stopped
    ports:
      # في بروتوكول PUSH يبتدئ جهاز البصمة الاتصال، فلا بدّ من مسار
      # يصل إليه. المسار المفضّل هو الدومين عبر الوسيط:
      #     http://<domain>/iclock  →  هذه الحاوية:8081
      # فالجهاز يستخدم المنفذ 80 افتراضيًّا حين يُضبط بدومين بلا منفذ،
      # وترويسة Host هي ما يميّز عميلًا عن آخر.
      # ويبقى المنفذ منشورًا لحالة الأجهزة التي تُضبط بعنوان IP مباشر.
      - "${BIND:-0.0.0.0}:${ADMS_PORT:-8081}:8081"
    volumes:
      - hr_data:/app/data
    environment:
      - HR_DATA_DIR=/app/data
      - ADMS_PORT=8081
      - TZ=${TZ:-Asia/Kuwait}
      - COMPANY_NAME=${COMPANY}
    command: python adms_server.py
    depends_on:
      hr_web:
        condition: service_healthy

volumes:
  # التخزين يُسمّى تلقائيًّا <اسم_المشروع>_hr_data، أي أن `-p` يعزل
  # بيانات كل عميل عن الآخر بلا إعداد إضافي. وهذا مهم بعد تثبيت معرّف
  # التركيب: المعرّف محفوظ داخل هذا التخزين، فبقاؤه يعني بقاء الترخيص
  # صالحًا عبر إعادة البناء.
  hr_data:
