{% extends "base.html" %}

{% block title %}{{ _('x.feature_not_in_plan_title') }}{% endblock %}

{% block content %}
<div class="container py-5 text-center" id="feature-locked" data-feature="{{ feature }}">
    <div class="mb-4">
        <i class="fas fa-lock text-secondary" style="font-size: 4rem;"></i>
    </div>
    <h1 class="h3 fw-bold mb-3">{{ _('x.feature_not_in_plan', feature=feature_label) }}</h1>
    <p class="lead text-muted mb-4">{{ _('x.feature_not_in_plan_details') }}</p>
    <a href="{{ upgrade_url }}" target="_blank" rel="noopener" class="btn btn-primary btn-lg px-4">
        {{ _('x.upgrade_plan') }}
    </a>
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary btn-lg px-4 ms-2">
        {{ _('x.return_home') }}
    </a>
</div>
{% endblock %}
