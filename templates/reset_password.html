<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تعيين كلمة المرور | HR Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.9);
            --ios-border: rgba(0, 0, 0, 0.08);
            --ios-text: #1C1C1E;
            --ios-subtext: #8E8E93;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Tajawal", sans-serif;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--ios-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            background: var(--ios-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 26px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .reset-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--ios-blue), #5856D6);
            color: white;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.28);
        }

        .reset-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .reset-subtitle {
            font-size: 0.88rem;
            color: var(--ios-subtext);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .user-pill {
            background: rgba(0, 122, 255, 0.08);
            color: var(--ios-blue);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--ios-subtext);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        .form-control-ios {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--ios-border);
            background: #F8F8FA;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control-ios:focus {
            border-color: var(--ios-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            background: var(--ios-blue);
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.3);
            transition: transform 0.15s ease;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .alert-error {
            background: rgba(255, 59, 48, 0.1);
            color: var(--ios-red);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: right;
            border-inline-start: 4px solid var(--ios-red);
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="reset-icon">
            <i class="fas fa-key"></i>
        </div>

        <h2 class="reset-title">تعيين كلمة المرور</h2>
        <p class="reset-subtitle">يرجى إدخال كلمة المرور الجديدة لحسابك لتسجيل الدخول والوصول إلى بوابة الموظف.</p>

        {% if error %}
        <div class="alert-error">
            <i class="fas fa-circle-exclamation me-1"></i> {{ error }}
        </div>
        <a href="{{ url_for('auth.login') }}" class="btn-submit" style="display: block; text-decoration: none; margin-top: 10px;">
            العودة لصفحة الدخول
        </a>
        {% else %}

        {% if user %}
        <div class="user-pill">
            <i class="fas fa-user me-1"></i> {{ user.full_name }} ({{ user.username }})
        </div>
        {% endif %}

        <form method="POST" action="/reset-password">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="form-group">
                <label>كلمة المرور الجديدة</label>
                <div class="input-wrap">
                    <input type="password" class="form-control-ios" name="password" required placeholder="••••••••" minlength="4">
                </div>
            </div>

            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <div class="input-wrap">
                    <input type="password" class="form-control-ios" name="confirm_password" required placeholder="••••••••" minlength="4">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-check-circle me-1"></i> حفظ كلمة المرور والدخول
            </button>
        </form>
        {% endif %}
    </div>

</body>
</html>
