<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة QR</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f2f4f3; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  .box { background: #fff; border-radius: 18px; padding: 28px 22px; text-align: center; width: min(380px, 100%); box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .icon { font-size: 52px; }
  #msg { font-size: 20px; font-weight: 700; margin: 14px 0; }
  .ok { color: #1F8A5B; } .bad { color: #c0392b; }
  a { display: inline-block; margin-top: 10px; color: #1F5C4A; }
</style>
</head>
<body>
<div class="box">
  <div class="icon" id="icon">⏳</div>
  <div id="msg">بيتسجّل…</div>
  <a href="{{ url_for('portal.dashboard') }}">رجوع للبوابة</a>
</div>
<script>
(async () => {
  const msg = document.getElementById('msg'), icon = document.getElementById('icon');
  try {
    const r = await fetch('{{ url_for("smart_punch.qr_punch") }}', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kiosk_id: {{ kid }}, code: {{ code|tojson }} }) });
    const d = await r.json();
    msg.textContent = d.message; msg.className = d.success ? 'ok' : 'bad'; icon.textContent = d.success ? '✅' : '⚠️';
  } catch (e) { msg.textContent = 'مفيش اتصال — جرّب تاني'; msg.className = 'bad'; icon.textContent = '⚠️'; }
})();
</script>
</body>
</html>
