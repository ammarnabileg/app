# بناءُ برنامج الويندوز وحزمةِ التحديث على جهاز ويندوز حقيقيّ.
#
# يُشغَّل وحده عند دفع فرع إصدار (v2.25.0.0 مثلًا)، أو يدويًّا
# (Actions ← Build Windows ← Run workflow). المخرجات:
#   HRSystem-<الإصدار>.zip         حزمةُ التحديث كما يطلبها publish_version.py
#   HRSystem-<الإصدار>.sha256.txt  بصمتُها — تُقارَن بعد رفعها إلى رابط التنزيل
#
# وبعد أن ينجح اختبارُ التشغيل يُنشئ **إصدارًا على GitHub** (Releases) باسم
# v<الإصدار> ويُرفق به الحزمةَ وبصمتها، وملاحظاتُه قسمُ الإصدار من CHANGELOG.md.
# الـartifact وحده كان يُمحى بعد ٣٠ يومًا ويحتاج تسجيلَ دخولٍ لتنزيله؛ والإصدارُ
# رابطٌ ثابت لا ينتهي. لا أسرار: `GITHUB_TOKEN` الذي يُعطيه GitHub للتشغيل نفسه.
# ونشرُ التحديث للعملاء (publish_version.py بلا --dry-run) يبقى خطوةً يدويّة
# بمفتاح اللوحة، كما في docs/RELEASE.md.
name: Build Windows

permissions:
  contents: write      # لإنشاء الإصدار ورفع ملفّاته فقط

on:
  workflow_dispatch:
  push:
    branches: ['v*.*.*.*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from utils.version_info import CURRENT_VERSION; print(CURRENT_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python build_app.py

      - name: Package update (dry run, nothing is sent)
        shell: bash
        run: |
          python tools/publish_version.py --build --dry-run \
            --url "https://onz.one/downloads/HRSystem-${{ steps.ver.outputs.v }}.zip"
          mv dist/HRSystem.zip "dist/HRSystem-${{ steps.ver.outputs.v }}.zip"
          sha256sum "dist/HRSystem-${{ steps.ver.outputs.v }}.zip" | tee "dist/HRSystem-${{ steps.ver.outputs.v }}.sha256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: HRSystem-${{ steps.ver.outputs.v }}
          path: |
            dist/HRSystem-${{ steps.ver.outputs.v }}.zip
            dist/HRSystem-${{ steps.ver.outputs.v }}.sha256.txt
          compression-level: 0
          retention-days: 30

      # البرنامجُ المبنيّ يُشغَّل فعلًا: يقوم الخادمُ المحلّيّ ويردّ الصفحةَ الأولى.
      - name: Smoke test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'hrdata'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:HR_DATA_DIR = $data
          $p = Start-Process -FilePath 'dist/HRSystem/HRSystem.exe' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { Write-Host "exited with $($p.ExitCode)"; break }
            try {
              # الصفحةُ الأولى كما يفتحها المتصفّح ("/" وتحويلاتُها)، وموقَّعةٌ بنسخة هذا البناء —
              # لا ردَّ برنامجٍ آخر على المنفذ.
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Headers['X-HR-System'] -eq '${{ steps.ver.outputs.v }}') { $ok = $true; break }
            } catch { }
          }
          Get-ChildItem $data -Recurse -Include *.log | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_ -Tail 40 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { throw 'HRSystem.exe did not serve / on port 5000 with its X-HR-System header' }
          Write-Host 'HRSystem.exe started and served / (signed ${{ steps.ver.outputs.v }})'

      # بعد اختبار التشغيل لا قبله: لا يُنشر بناءٌ لا يقوم.
      # والإصدارُ لفروع الإصدار (v2.37.0.0) وحدها: تشغيلٌ يدويّ من فرع تجربة (dev1) يبني
      # ويُرفق الحزمة بالتشغيل (artifact) فقط — كان يُنشئ إصدارًا عامًّا، أو يكتب فوق
      # ملفّات إصدارٍ منشور يحمل الرقمَ نفسه.
      - name: Release notes
        if: startsWith(github.ref_name, 'v')
        shell: bash
        run: |
          python - <<'PY'
          import re
          v = "${{ steps.ver.outputs.v }}"
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(v) + r'\b.*?(?=^## |\Z)', text, re.S | re.M)
          body = (m.group(0).strip() if m else f'## {v}').rstrip('-').rstrip()
          open('release-notes.md', 'w', encoding='utf-8').write(body + '\n')
          PY

      - name: GitHub Release
        if: startsWith(github.ref_name, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          tag="v$v"
          files=("dist/HRSystem-$v.zip" "dist/HRSystem-$v.sha256.txt")
          if gh release view "$tag" >/dev/null 2>&1; then
            # إعادةُ تشغيلٍ للإصدار نفسه: تُستبدل الملفّات والملاحظات.
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${files[@]}" --target "${{ github.sha }}" \
              --title "HRSystem $v" --notes-file release-notes.md
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag"

